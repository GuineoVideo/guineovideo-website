<!DOCTYPE html>
<html lang="es" class="bg-brand-cream text-brand-black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-brand-cream min-h-screen">

  <nav class="bg-brand-cream/90 border-b border-brand-black/15 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-4 group">
        <div class="bg-brand-yellow p-2 rounded-xl border border-brand-black/10 flex items-center justify-center transition group-hover:bg-brand-gold shadow-sm">
          <img src="../assets/GUINEOLOGO.png" alt="Guineo Logo" class="h-12 md:h-16 w-auto object-contain">
        </div>
        <span class="font-black tracking-widest text-brand-black group-hover:text-brand-gold transition text-xl">PRODUCCIONES</span>
      </a>

      <div class="hidden md:flex space-x-8 text-sm font-extrabold tracking-wide text-brand-black">
        <a href="biombo.html" class="hover:text-brand-gold transition">Biombo</a>
        <a href="portafolio.html" class="hover:text-brand-gold transition">Portafolio</a>
        <a href="equipo.html" class="hover:text-brand-gold transition">Equipo</a>
        <a href="tienda.html" class="hover:text-brand-gold transition">Tienda</a>
        <a href="aportacion.html" class="hover:text-brand-gold transition">Aportación</a>
        <a href="contacto.html" class="text-brand-gold border-b-2 border-brand-gold pb-1">Contacto</a>
      </div>

      <button id="mobile-menu-btn" class="md:hidden text-brand-black hover:text-brand-gold">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
      </button>
    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-brand-cream border-b border-brand-black/15 px-6 py-4 flex flex-col space-y-3 font-bold text-brand-black">
      <a href="biombo.html" class="hover:text-brand-gold">Biombo</a>
      <a href="portafolio.html" class="hover:text-brand-gold">Portafolio</a>
      <a href="equipo.html" class="hover:text-brand-gold">Equipo</a>
      <a href="tienda.html" class="hover:text-brand-gold">Tienda</a>
      <a href="aportacion.html" class="hover:text-brand-gold">Aportación</a>
      <a href="contacto.html" class="text-brand-gold font-extrabold">Contacto</a>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-6 py-12">
    <h1 class="text-5xl font-black mb-8 text-brand-black text-center">Contacto</h1>
    <form class="space-y-5 bg-white p-8 rounded-3xl border-2 border-brand-black/15 shadow-sm">
      <div>
        <label class="block text-sm font-bold mb-2 text-brand-black">Nombre</label>
        <input type="text" class="w-full bg-brand-cream/30 border border-brand-black/20 rounded-xl px-4 py-3 text-brand-black focus:outline-none focus:ring-2 focus:ring-brand-yellow font-medium">
      </div>
      <div>
        <label class="block text-sm font-bold mb-2 text-brand-black">Correo Electrónico</label>
        <input type="email" class="w-full bg-brand-cream/30 border border-brand-black/20 rounded-xl px-4 py-3 text-brand-black focus:outline-none focus:ring-2 focus:ring-brand-yellow font-medium">
      </div>
      <div>
        <label class="block text-sm font-bold mb-2 text-brand-black">Mensaje</label>
        <textarea rows="4" class="w-full bg-brand-cream/30 border border-brand-black/20 rounded-xl px-4 py-3 text-brand-black focus:outline-none focus:ring-2 focus:ring-brand-yellow font-medium"></textarea>
      </div>
      <button type="submit" class="w-full bg-brand-yellow hover:bg-brand-gold text-brand-black border border-brand-black/20 font-extrabold py-4 rounded-xl transition shadow-md">
        Enviar Mensaje
      </button>
    </form>
  </main>

  <script src="../js/main.js"></script>
</body>
</html>
