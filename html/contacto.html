  <main class="max-w-2xl mx-auto px-6 py-12">
    <h1 class="text-5xl font-black mb-8 text-brand-black text-center">Contacto</h1>

    <!--
      FORMSPREE: crear el formulario en formspree.io con el correo info@guineovideo.com
      (el destino se configura en el dashboard de Formspree, no aquí) y reemplazar
      TU_FORM_ID en el action por el ID que te dan (ej. https://formspree.io/f/abcdwxyz).
    -->
    <form id="contact-form" action="https://formspree.io/f/TU_FORM_ID" method="POST" class="space-y-5 bg-white p-8 rounded-3xl border-2 border-brand-black shadow-md">
      <input type="hidden" name="_subject" value="Nuevo mensaje desde guineovideo.com">
      <!-- Honeypot anti-spam: no borrar -->
      <input type="text" name="_gotcha" class="hidden" tabindex="-1" autocomplete="off">
      <div>
        <label for="nombre" class="block text-sm font-bold mb-2 text-brand-black">Nombre</label>
        <input id="nombre" name="nombre" type="text" required autocomplete="name" class="w-full bg-brand-cream/30 border border-brand-black/30 rounded-xl px-4 py-3 text-brand-black focus:outline-none focus:ring-2 focus:ring-brand-yellow font-medium">
      </div>
      <div>
        <label for="email" class="block text-sm font-bold mb-2 text-brand-black">Correo Electrónico</label>
        <input id="email" name="email" type="email" required autocomplete="email" class="w-full bg-brand-cream/30 border border-brand-black/30 rounded-xl px-4 py-3 text-brand-black focus:outline-none focus:ring-2 focus:ring-brand-yellow font-medium">
      </div>
      <div>
        <label for="mensaje" class="block text-sm font-bold mb-2 text-brand-black">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" required class="w-full bg-brand-cream/30 border border-brand-black/30 rounded-xl px-4 py-3 text-brand-black focus:outline-none focus:ring-2 focus:ring-brand-yellow font-medium"></textarea>
      </div>
      <button type="submit" class="w-full bg-brand-yellow hover:bg-brand-gold disabled:opacity-60 text-brand-black border-2 border-brand-black font-extrabold py-4 rounded-xl transition shadow-md">
        Enviar Mensaje
      </button>
      <p id="form-status" class="hidden text-center font-bold rounded-xl px-4 py-3" role="status" aria-live="polite"></p>
    </form>

    <!-- REDES SOCIALES -->
    <section class="mt-12 text-center">
      <h2 class="text-2xl font-black mb-2">Síguenos</h2>
      <p class="font-medium text-brand-black/80 mb-6">
        O escríbenos directo a <a href="mailto:info@guineovideo.com" class="font-extrabold underline underline-offset-4">info@guineovideo.com</a>
      </p>
      <div class="flex justify-center gap-4">
        <a href="#" target="_blank" rel="noopener" class="social-link" aria-label="Instagram" title="Instagram"><!-- TODO: URL de Instagram -->
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2Zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5a4.25 4.25 0 0 0 4.25-4.25v-8.5A4.25 4.25 0 0 0 16.25 3.5h-8.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 1.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm5.25-2.75a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></svg>
        </a>
        <a href="#" target="_blank" rel="noopener" class="social-link" aria-label="TikTok" title="TikTok"><!-- TODO: URL de TikTok -->
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M16.6 2h-3.1v13.2a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9.2a6.1 6.1 0 1 0 5.1 6V8.6a7.6 7.6 0 0 0 4.4 1.4V6.9A4.5 4.5 0 0 1 16.6 2Z"/></svg>
        </a>
        <a href="#" target="_blank" rel="noopener" class="social-link" aria-label="YouTube" title="YouTube"><!-- TODO: URL de YouTube -->
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8ZM9.75 15.5v-7l6 3.5-6 3.5Z"/></svg>
