<!DOCTYPE html>
<html lang="es" class="bg-brand-cream text-brand-black">
<head>

<body class="min-h-screen flex flex-col justify-between items-center text-center px-6 py-12 relative bg-brand-cream">

      <img src="assets/GUINEOLOGO.png" alt="Guineo Logo" class="h-32 md:h-44 w-auto object-contain">
    </div>
    <h1 class="text-xs md:text-sm tracking-[0.4em] uppercase text-brand-black/80 font-bold">
      Casa Productora
    </h1>
  </header>

  <!-- Hero Principal -->
  <main class="max-w-4xl my-auto py-10">
	<span class="bg-brand-yellow border border-brand-black/20 text-brand-black font-extrabold tracking-widest uppercase text-xs px-4 py-1.5 rounded-full inline-block mb-4 shadow-sm">

    </span> 
	<h2 class="text-6xl md:text-8xl font-black tracking-tight mb-6 text-brand-black">

    <p class="text-brand-black/80 text-lg md:text-xl max-w-2xl mx-auto mb-10 leading-relaxed font-medium">
    
Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aenean et nisi ipsum. Nulla non bibendum mi. Sed ultricies pulvinar purus.
</p>

    <div class="flex flex-col sm:flex-row justify-center gap-4">
      <a href="html/biombo.html" class="bg-brand-yellow hover:bg-brand-gold text-brand-black border-2 border-brand-black/20 font-extrabold px-8 py-4 rounded-xl transition shadow-md hover:shadow-lg">
        Ver Proyecto Biombo
      </a>
      <a href="html/portafolio.html" class="bg-white hover:bg-brand-black hover:text-brand-cream border-2 border-brand-black text-brand-black font-bold px-8 py-4 rounded-xl transition shadow-sm">
        Explorar Portafolio
      </a>
    </div>
  </main>

  <!-- Footer con menú de navegación -->
  <footer class="w-full max-w-4xl">
    <div class="grid grid-cols-2 sm:grid-cols-6 gap-4 pt-8 border-t border-brand-black/20 text-xs tracking-wider text-brand-black/80 uppercase font-bold">
      <a href="html/biombo.html" class="hover:text-brand-gold transition py-1 text-brand-black font-extrabold">Biombo</a>
      <a href="html/portafolio.html" class="hover:text-brand-gold transition py-1">Portafolio</a>

      <a href="html/contacto.html" class="hover:text-brand-gold transition py-1">Contacto</a>

  <script src="js/main.js"></script>
